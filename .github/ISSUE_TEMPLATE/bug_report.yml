name: Bug report
description: Report a reproducible problem without sharing credentials.
body:
  - type: markdown
    attributes:
      value: Never attach auth.json, vault files, access tokens, refresh tokens, or private signing keys. Redact account names and email addresses from screenshots.
  - type: input
    id: version
    attributes:
      label: App version
      description: Find this in Settings.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and installed Codex version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include expected behavior and what actually happened.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional context
      description: Use synthetic examples and redact personal information.
