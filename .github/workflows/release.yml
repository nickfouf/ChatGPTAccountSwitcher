name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
  release:
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up Rust
        run: rustup toolchain install 1.96.0 --profile minimal
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Validate version and signing setup
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'A stable version tag is required.' }
          if (!$env:SIGNING_KEY) { throw 'Run scripts/setup-github.ps1 to configure the signing secret.' }
          npm run release:validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build signed installer and update manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run release:build
      - name: Keep downloadable build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-${{ env.RELEASE_TAG }}
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw 'Published releases are immutable. Create a new version instead.' }
            gh release edit $env:RELEASE_TAG --title "ChatGPT Account Switcher $env:RELEASE_TAG" --notes-file release/release-notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "ChatGPT Account Switcher $env:RELEASE_TAG" --notes-file release/release-notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $assets = @(Get-Content -LiteralPath release/SHA256SUMS.txt | ForEach-Object { Join-Path release ($_ -split '  ', 2)[1] })
          $assets += 'release/SHA256SUMS.txt'
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Draft release prepared. Review the installer and notes, then publish the draft to deliver updates.'
