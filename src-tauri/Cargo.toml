[package]
name = "chatgpt-account-switcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "An independent Windows companion for saving and switching Codex accounts"
license = "MIT"
repository = "https://github.com/nickfouf/ChatGPTAccountSwitcher"
publish = false
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
notify = "8"
tauri-plugin-updater = "2"
[profile.release]
strip = true

[dev-dependencies]
minisign-verify = "0.3"
